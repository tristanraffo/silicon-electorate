[project]
name = "silicon-electorate"
version = "0.1.0"
description = "Arrow's domain condition in LLM electorates: matched silicon sampling against ANES."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "pydantic>=2",
    "pyyaml",
    "typer",
    "tqdm",
    "scipy",
    "scikit-learn",
    "transformers",
    "torch",
    "pyreadstat",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
# Prod only (vast.ai CUDA). `uv sync --extra gpu`. Never installed on the Mac dev box.
gpu = ["vllm>=0.8; sys_platform == 'linux'"]

[project.scripts]
scv = "scv.cli:app"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not hf'"
markers = [
    "hf: loads a real (tiny) Hugging Face model; run with `uv run pytest -m hf`",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# HTML, CSS and SVG templates: long string literals read better unbroken
"src/scv/report.py" = ["E501"]
