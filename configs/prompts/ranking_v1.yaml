# Full ranking (SPEC §10.2). {candidate_lines} is one candidate per line, in the
# per-call randomised order.
id: ranking_v1
max_tokens: 96
user: |-
  The following is how a survey respondent describes themselves:

  "{persona}"

  Answer the survey question below exactly as this person would.

  Here are the candidates:
  {candidate_lines}

  Rank these candidates from most to least preferred. Ties are allowed; write tied candidates on the same line separated by '='. Output only the ranking, one line per rank.
repair: "Please output only the ranking: every candidate exactly once, one line per rank, tied candidates on the same line separated by '='."
