# A second column used where the field's own column gives no label (two-step questions).
persona_fallbacks:
  vote_prior:
    var: turnout12        # 2 = "Definitely did not vote" in 2012
    labels: {2: did not vote}
# The thermometer introduction from the questionnaire. The candidate's name follows on
# its own line in the prompt.
question_text: >-
  We'd like to get your feelings toward some of our political leaders and other people who are
  in the news these days. We'll show the name of a person or group and we'd like you to rate
  that person or group using something we call the feeling thermometer. Ratings between 50
  degrees and 100 degrees mean that you feel favorable and warm toward the person. Ratings
  between 0 degrees and 50 degrees mean that you don't feel favorable toward the person and that
  you don't care too much for that person. You would rate the person at the 50 degree mark if
  you don't feel particularly warm or cold toward the person. How would you rate:
