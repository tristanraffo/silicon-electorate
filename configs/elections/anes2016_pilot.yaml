# ANES 2016 Pilot Study (anes_pilot_2016.csv; YouGov, fielded January 22-28, 2016).
# Every column name below was read from the codebook and questionnaire shipped with the
# data and checked against the CSV. See DECISIONS.md, section "ANES 2016 Pilot".
# `scv data check anes2016_pilot` lists everything still to fill in.
id: anes2016_pilot
file: data/raw/anes_pilot_2016.csv
weight_var: weight      # "Case weight" (mean 1); weight_spss is the same weight rescaled
id_var: caseid
candidates:             # display name -> feeling thermometer column
  Hillary Clinton: fthrc
  Bernie Sanders: ftsanders
  Donald Trump: fttrump
  Ted Cruz: ftcruz
  Marco Rubio: ftrubio
  # Also in the file: Barack Obama ftobama, Jeb Bush ftjeb, Ben Carson ftcarson,
  # Carly Fiorina ftfiorina.
valid_range: [0, 100]   # 998 = skipped
min_rated: 3
persona_vars:
  age: birthyr                    # birth year; turned into an age by value_labels
  gender: gender
  race_ethnicity: race
  education: educ
  # income: faminc                # NOT USED: the documentation gives only four of its
  #                               # value labels (3, 5, 7, 11). See DECISIONS.md P4.
  state_or_region: state          # FIPS state code; turned into a census region below
  party_id_7: pid7
  ideology_7: lcself              # 7-point self-placement asked in the pilot itself
  religious_attendance: pew_churatd
  vote_prior: vote12              # asked only of those who (probably) voted in 2012
# persona field -> {code: label}. Unlisted codes (not sure, don't know, skipped,
# not asked) are missing and that sentence is left out of the persona.
